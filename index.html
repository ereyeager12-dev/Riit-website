<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RIIT Education | Admission Open 2026</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        /* NAVBAR */

        nav {
            background: #111827;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #38bdf8;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        /* HERO */

        .hero {
            min-height: 500px;
            padding: 80px 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
        }

        .hero-text {
            max-width: 600px;
        }

        .badge {
            display: inline-block;
            background: #38bdf8;
            color: #082f49;
            padding: 8px 15px;
            border-radius: 30px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 50px;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #38bdf8;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.6;
            color: #dbeafe;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 25px;
            background: #38bdf8;
            color: #082f49;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            background: white;
        }

        /* ADMISSION */

        .admission {
            text-align: center;
            padding: 50px 20px;
        }

        .admission h2 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #111827;
        }

        .admission p {
            color: #64748b;
            margin-bottom: 35px;
        }

        /* COURSES */

        .courses {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            max-width: 1100px;
            margin: auto;
            padding: 0 20px 70px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: 0.3s;
            border: 1px solid #e5e7eb;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .card .icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .card h3 {
            color: #1e3a8a;
            margin-bottom: 10px;
            font-size: 22px;
        }
